.nav{background:#0E0F11;color:#fff;position:sticky;top:0;z-index:20}.nav .w{display:flex;align-items:center;gap:18px;padding:11px 24px;max-width:1280px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.4rem;font-size:1.7rem;font-weight:700}.brand .lg{width:30px;height:42px;background:var(--logo) center/contain no-repeat}.brand b{color:#E5202F}
.nav nav{display:flex;gap:4px;flex-wrap:wrap}.nav nav a{font-size:.82rem;font-weight:600;color:#D7D9DE;padding:10px;border-bottom:2px solid transparent}.nav nav a:hover{color:#fff}.nav nav a.on{color:#fff;border-color:var(--red)}
.pill{margin-left:auto;display:inline-flex;align-items:center;border-radius:30px;padding:9px 18px;font-size:.82rem;font-weight:700;background:var(--red);color:#fff}.pill:hover{background:var(--red2)}
.fh{background:linear-gradient(180deg,#FDEDEE,#fff);padding:38px 0 6px}.fh h1{font-size:clamp(1.8rem,3.5vw,2.5rem);font-weight:800}.fh h1 span{color:var(--red)}.fh p{color:var(--mute);margin-top:4px}
.gs{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin:26px 0}
.gb{position:relative;font:inherit;cursor:pointer;background:#fff;border:1px solid var(--line);border-top:7px solid var(--red);border-radius:6px 6px 20px 20px;text-align:center;padding:14px 4px 12px;box-shadow:0 4px 12px rgba(60,20,30,.07);transition:transform .2s,box-shadow .2s;color:var(--ink)}
.gb:before{content:"";position:absolute;top:-7px;left:50%;width:16px;height:5px;background:var(--ink);transform:translateX(-50%);border-radius:0 0 4px 4px}
.gb b{display:block;font-size:1.55rem;font-weight:800;color:var(--red);line-height:1.1}.gb small{display:block;font-size:.7rem;color:var(--mute)}
.gb:hover{transform:translateY(-4px)}.gb[aria-pressed=true]{background:var(--red);border-color:var(--red)}.gb[aria-pressed=true] b,.gb[aria-pressed=true] small{color:#fff}
.sum{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}.sum h2{font-size:1.4rem}.sum span{color:var(--mute);font-size:.88rem}
.tb{width:100%;border-collapse:separate;border-spacing:0 8px}.tb th{text-align:left;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:0 16px}
.tb td{background:#fff;padding:13px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.92rem}.tb td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px;font-weight:700}.tb td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.stp{display:inline-block;padding:4px 11px;border-radius:20px;font-size:.74rem;font-weight:700}.stp.a{background:#E4F6EA;color:#12703A}.stp.r{background:#FFF1D6;color:#8A5A00}
.ph{padding:44px 20px;text-align:center;background:#fff;border:1px dashed #E3C0C6;border-radius:14px;color:var(--mute)}.ph b{display:block;color:var(--ink);margin-bottom:4px}
.more{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:22px 0 50px;background:#FFF1F2;border:1px solid #F4C9CE;border-radius:14px;padding:16px 20px}
@media(max-width:900px){.gs{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.gs{gap:9px}.gb b{font-size:1.2rem}.tb th:nth-child(3),.tb td:nth-child(3){display:none}}
</style>
</head>
<body>
<header class="nav"><div class="w">
  <a class="brand" href="/"><span class="lg"></span><span>Rakt<b>Setu</b></span></a>
  <nav aria-label="Main"><a href="/">Home</a><a href="/find-blood.html">Find Donors</a><a class="on" href="/blood-groups.html">Blood Groups</a></nav>
  <a class="pill" href="/blood-request.html">Request Blood</a>
</div></header>

<section class="fh"><div class="w"><h1>Donors by <span>Blood Group</span></h1><p>Pick a blood group to see the verified donors registered for it.</p></div></section>

<main class="w">
  <div class="gs" id="gs" role="group" aria-label="Blood groups"></div>
  <div class="sum"><h2 id="ttl">Select a blood group</h2><span id="cnt"></span></div>
  <div id="list"><div class="ph"><b>Loading…</b></div></div>
  <div class="more"><span id="rcv"></span><a class="pill" style="margin:0" href="/blood-request.html">Request blood</a></div>
</main>

<script>
const $ = id => document.getElementById(id), show = g => g.replace('-', '−');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GROUPS = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];
const FROM = { 'A+': 'A+, A−, O+, O−', 'A-': 'A−, O−', 'B+': 'B+, B−, O+, O−', 'B-': 'B−, O−', 'AB+': 'every blood group', 'AB-': 'A−, B−, AB−, O−', 'O+': 'O+, O−', 'O-': 'O− only' };
let data = {}, cur = 'A+';
function draw() {
  document.querySelectorAll('.gb').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === cur));
  const g = data[cur] || { total: 0, available: 0, donors: [] };
  $('ttl').textContent = show(cur) + ' donors'; $('cnt').textContent = g.total + ' registered · ' + g.available + ' ready to donate now';
  $('rcv').innerHTML = `A <b>${show(cur)}</b> patient can receive blood from: <b>${FROM[cur]}</b>.`;
  $('list').innerHTML = g.donors.length ? `<table class="tb"><thead><tr><th>Donor</th><th>City</th><th>Area</th><th>Status</th></tr></thead><tbody>${g.donors.map(d =>
    `<tr><td>${esc(d.name)}</td><td>${esc(d.city || '–')}</td><td>${esc(d.area || '–')}</td><td><span class="stp ${d.ready ? 'a' : 'r'}">${d.ready ? 'Available' : 'Resting'}</span></td></tr>`).join('')}</tbody></table>`
    : `<div class="ph"><b>No verified ${show(cur)} donors yet</b>Be the first. <a href="/become-donor.html" style="color:var(--red);font-weight:700">Register as a donor</a></div>`;
}
$('gs').innerHTML = GROUPS.map(g => `<button class="gb" data-g="${g}" aria-pressed="false"><b>${show(g)}</b><small id="n-${g}">–</small></button>`).join('');
$('gs').onclick = e => { const b = e.target.closest('.gb'); if (b) { cur = b.dataset.g; draw(); } };
fetch('/api/groups').then(r => r.ok ? r.json() : Promise.reject()).then(d => { data = d; GROUPS.forEach(g => $('n-' + g).textContent = d[g].total + ' donors'); draw(); })
  .catch(() => $('list').innerHTML = '<div class="ph"><b>Could not load donors</b>Please try again in a moment.</div>');
</script>
</body>
</html>
